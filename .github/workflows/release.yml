name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Required for npm OIDC trusted publishing (no NPM_TOKEN secret involved).
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11+
        run: npm i -g npm@^11.5.0

      - run: bun install --frozen-lockfile

      # Publish nothing that has not passed the same gates as a PR.
      - run: bun run lint:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run verify:build

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps package.json in its release commit, so rebuild
      # from the released tree before packing.
      - name: Rebuild at the released version
        if: ${{ steps.release.outputs.release_created }}
        run: |
          git fetch --tags
          git checkout ${{ steps.release.outputs.tag_name }}
          bun install --frozen-lockfile
          bun run build
          bun run verify:build

      - name: Publish to npm (OIDC trusted publishing)
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish

      - name: Attach the browser bundle to the GitHub release
        if: ${{ steps.release.outputs.release_created }}
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ steps.release.outputs.tag_name }}
          files: |
            dist/app-bridge.global.js
            dist/app-bridge.global.js.map
