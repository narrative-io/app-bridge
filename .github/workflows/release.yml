name: Release

on:
  push:
    branches: [main]
  # Retry path for a publish that failed after release-please already tagged.
  # A plain re-run does not work: release-please reports `release_created` only
  # on the push that merges its PR, so on any later run the publish step would
  # be skipped and the version would stay missing from npm.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required for npm OIDC trusted publishing (no NPM_TOKEN secret involved).
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm may be
      # older, and an older npm falls back to looking for a token that does not
      # exist here.
      - name: Ensure npm supports trusted publishing
        run: npm i -g npm@^11.5.1

      # setup-node's `registry-url` always writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into a temp .npmrc.
      # With no NODE_AUTH_TOKEN secret — which is the point of trusted publishing
      # — that expands to an EMPTY token, and npm then believes auth is already
      # configured and never starts the OIDC exchange. It sends the empty bearer
      # instead and the registry answers 404, which reads like a permissions
      # problem and is not one. Stripping the line lets npm see
      # ACTIONS_ID_TOKEN_REQUEST_* and exchange the OIDC token properly.
      # Upstream bug: https://github.com/actions/setup-node/issues/1551
      - name: Remove the empty auth-token line that suppresses OIDC
        run: |
          set -euo pipefail
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "Stripped _authToken from $npmrc. Remaining config:"
            cat "$npmrc"
          fi

      - run: bun install --frozen-lockfile

      # Publish nothing that has not passed the same gates as a PR.
      - run: bun run lint:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run verify:build

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Publish when release-please just cut a release, or when a human dispatched
      # this workflow to retry one. Either way, skip if the version is already on
      # npm, so a retry is idempotent rather than a confusing 403.
      - name: Decide whether to publish
        id: gate
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$RELEASE_CREATED" != "true" ] && [ "$EVENT" != "workflow_dispatch" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No release was cut on this push, and this is not a manual retry. Nothing to publish."
            exit 0
          fi
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already on npm. Nothing to do."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Will publish $name@$version."

      # Without this, a missing prerequisite surfaces as `ENEEDAUTH` ("you need
      # to authorize this machine"), which sends you looking for a token that is
      # deliberately absent. Check the two things OIDC actually needs and say
      # which one is missing.
      - name: Verify OIDC prerequisites
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          echo "npm $(npm --version) at $(command -v npm)"
          echo "node $(node --version)"
          failed=0
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC token endpoint in this job's environment, so npm cannot exchange anything. The job needs 'id-token: write'."
            failed=1
          else
            echo "OIDC token endpoint: present"
          fi
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "--- npmrc ($npmrc) ---"
          cat "$npmrc" 2>/dev/null || echo "(no npmrc)"
          if grep -q "_authToken" "$npmrc" 2>/dev/null; then
            echo "::error::An _authToken line is still present; npm will treat auth as configured and skip OIDC."
            failed=1
          fi
          exit $failed

      # TEMPORARY DIAGNOSTIC — remove once trusted publishing is confirmed working.
      # npm falls back to ENEEDAUTH when the OIDC exchange is refused, which hides
      # the registry's actual reason. Do the exchange by hand to surface it.
      - name: Probe the OIDC exchange
        if: steps.gate.outputs.publish == 'true'
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "1. requesting a GitHub OIDC token for audience npm:registry.npmjs.org"
          idtok=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(JSON.parse(s).value||'')}catch{}})")
          if [ -z "$idtok" ]; then echo "   FAILED to get an id-token"; exit 0; fi
          echo "   got an id-token ($(printf %s "$idtok" | wc -c | tr -d ' ') chars)"
          # Claims identify the workflow to npm; these are what the trusted
          # publisher config is matched against. Not secret.
          echo "2. claims npm will match against your trusted publisher:"
          printf %s "$idtok" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);for(const k of ['iss','aud','sub','repository','repository_owner','workflow_ref','job_workflow_ref','environment','ref','event_name'])console.log('     '+k+': '+(c[k]??'(absent)'))})"
          echo "3. asking the registry to exchange it"
          code=$(curl -s -o /tmp/ex.json -w '%{http_code}' -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $idtok" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@narrative.io%2Fapp-bridge")
          echo "   HTTP $code"
          if [ "$code" != "200" ]; then echo "   body: $(cat /tmp/ex.json)"; else echo "   exchange succeeded (token not printed)"; fi
          # Control: same endpoint, a package that already publishes via OIDC.
          # Its trusted publisher names a different repo, so this cannot succeed —
          # but a DIFFERENT error proves the endpoint is right and the difference
          # is app-bridge's missing config rather than a bad probe.
          echo "4. control against a package known to use OIDC (must not succeed)"
          for pkg in "@narrative.io%2Fdata-collaboration-sdk-ts" "@narrative.io%2Fnope-does-not-exist"; do
            c=$(curl -s -o /tmp/ctl.json -w '%{http_code}' -X POST \
              -H "Content-Type: application/json" -H "Authorization: Bearer $idtok" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg")
            echo "   $pkg -> HTTP $c  body: $(head -c 200 /tmp/ctl.json)"
          done

      # No rebuild first: the checkout above already carries the released
      # version, and dist/ was built from it by the gate steps.
      - name: Publish to npm (OIDC trusted publishing)
        if: steps.gate.outputs.publish == 'true'
        run: npm publish --loglevel verbose

      - name: Attach the browser bundle to the GitHub release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # release-please only reports tag_name on the push that cut the
          # release; on a manual retry, derive it from the version instead.
          tag_name: ${{ steps.release.outputs.tag_name || format('v{0}', steps.gate.outputs.version) }}
          files: |
            dist/app-bridge.global.js
            dist/app-bridge.global.js.map
