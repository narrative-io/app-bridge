name: CI

on:
  # Every branch, not just main. A fork pull request creates commits in the fork,
  # never in this repository, so a push trigger fires for people who already have
  # write access — us, and Renovate — and never for an outside contributor. That
  # gives feature branches and dependency bumps automatic CI with none of the
  # exposure a `pull_request` trigger carries.
  push:
    branches: ['**']
  # No `pull_request` trigger, deliberately: this repository is public and the
  # release path holds real privilege (npm trusted publishing, `id-token: write`),
  # so nothing runs on a proposal from someone unvetted. The cost is that an
  # outside contributor's PR gets no checks until a maintainer pulls the branch
  # into this repository. When that becomes a real workflow, add `pull_request`
  # here — never `pull_request_target`, and never to a workflow holding secrets.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run lint:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test with coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build

      # The package publishes no root export and ships a browser bundle, so
      # "it compiled" is not enough — check the export map resolves and the
      # global attaches. Same gate `prepublishOnly` runs.
      - name: Verify build output
        run: bun run verify:build

  # A third party consuming this package is the thing most likely to break
  # silently, so install the packed tarball the way they would and import it
  # through the export map on the Node versions the package claims to support.
  consume:
    name: Consume packed tarball (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.19', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Pack and install into a bare consumer
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          tarball=$(ls /tmp/narrative.io-app-bridge-*.tgz)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install "$tarball" >/dev/null

      - name: Import through the export map
        working-directory: /tmp/consumer
        run: |
          set -euo pipefail
          cat > check.mjs <<'EOF'
          import { connect } from '@narrative.io/app-bridge/guest'
          import { createBridgeHost } from '@narrative.io/app-bridge/host'
          import { PROTOCOL_VERSION, BridgeError } from '@narrative.io/app-bridge/protocol'
          if (typeof connect !== 'function') throw new Error('guest.connect missing')
          if (typeof createBridgeHost !== 'function') throw new Error('host.createBridgeHost missing')
          if (PROTOCOL_VERSION !== 1) throw new Error('unexpected protocol version')
          if (!(new BridgeError('internal', 'x') instanceof Error)) throw new Error('BridgeError is not an Error')
          // The package deliberately has no root export; importing it must fail.
          let rootResolved = false
          try {
            await import('@narrative.io/app-bridge')
            rootResolved = true
          } catch {}
          if (rootResolved) throw new Error('root export resolved — host code is reachable from a bare import')
          console.log('consumer import OK')
          EOF
          node check.mjs

      # A wrong `types` condition in the export map still runs fine at runtime
      # and silently degrades every TypeScript consumer to `any`, so check the
      # two module resolutions consumers actually use.
      - name: Resolve types through the export map
        working-directory: /tmp/consumer
        run: |
          set -euo pipefail
          npm install --no-save typescript@5.9.3 >/dev/null
          cat > check.ts <<'EOF'
          import { connect, type AppBridge } from '@narrative.io/app-bridge/guest'
          import { createBridgeHost } from '@narrative.io/app-bridge/host'
          import type { Context, TokenGrant } from '@narrative.io/app-bridge/protocol'

          export async function boot(): Promise<AppBridge> {
            return connect({ platformOrigin: 'https://app.narrative.io' })
          }
          export function host(frame: HTMLIFrameElement, ctx: Context, grant: TokenGrant) {
            return createBridgeHost({
              frame,
              appOrigin: 'https://acme.example',
              hasInstallation: () => true,
              handlers: { getToken: async () => grant, getContext: async () => ctx, onPathChanged: () => {} },
            })
          }
          EOF
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module preserve --moduleResolution bundler --lib ES2022,DOM check.ts
          ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module nodenext --moduleResolution nodenext --lib ES2022,DOM check.ts

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Lints the commits in this push. Without a pull_request trigger this is
      # the only chance to catch a subject release-please would misread — it
      # derives the version bump and changelog from them.
      - name: Lint commit messages in this push
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            from="${{ github.sha }}~1"
          else
            from="$BEFORE"
          fi
          bunx commitlint --from "$from" --to "${{ github.sha }}" --verbose
